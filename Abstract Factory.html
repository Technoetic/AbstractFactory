<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소셜 로그인 - 추상 팩토리 패턴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .social-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .social-button:active {
            transform: translateY(0);
        }

        .social-button svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 15px;
            font-size: 14px;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .info strong {
            color: #333;
        }

        .debug-panel {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 11px;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-panel h3 {
            font-size: 13px;
            margin-bottom: 10px;
            color: #333;
        }

        .debug-item {
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }

        .debug-item strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>소셜 로그인</h1>
        <p class="subtitle">추상 팩토리 패턴으로 구현</p>
        
        <div class="social-buttons" id="socialButtons"></div>
        
        <div class="divider">
            <span>또는</span>
        </div>
        
        <div class="info">
            <strong>추상 팩토리 패턴 구조:</strong><br>
            • AbstractSocialFactory: 관련 제품군을 생성하는 추상 팩토리<br>
            • createButton(), createAuthClient(), createTokenParser(), createUserInfoAdapter()<br>
            • 각 구체 팩토리는 관련된 모든 제품을 함께 생성
        </div>
        
        <div class="debug-panel" id="debugPanel" style="display: none;">
            <h3>제품군 생성 로그</h3>
            <div id="debugContent"></div>
        </div>
    </div>

    <script>
        // ============================================
        // 추상 팩토리 패턴 구현
        // 관련 제품군을 함께 생성하는 패턴
        // ============================================

        // ========== 추상 제품 인터페이스들 ==========
        
        // Abstract Product: Button
        class AbstractButton {
            render() {
                throw new Error('render() must be implemented');
            }
        }

        // Abstract Product: AuthClient
        class AbstractAuthClient {
            authenticate() {
                throw new Error('authenticate() must be implemented');
            }
            getAuthUrl() {
                throw new Error('getAuthUrl() must be implemented');
            }
        }

        // Abstract Product: TokenParser
        class AbstractTokenParser {
            parse(token) {
                throw new Error('parse() must be implemented');
            }
            validate(token) {
                throw new Error('validate() must be implemented');
            }
        }

        // Abstract Product: UserInfoAdapter
        class AbstractUserInfoAdapter {
            adapt(rawData) {
                throw new Error('adapt() must be implemented');
            }
            getStandardFormat() {
                throw new Error('getStandardFormat() must be implemented');
            }
        }

        // ========== 추상 팩토리 인터페이스 ==========
        
        class AbstractSocialFactory {
            // 관련 제품군을 생성하는 메서드들
            createButton() {
                throw new Error('createButton() must be implemented');
            }
            
            createAuthClient() {
                throw new Error('createAuthClient() must be implemented');
            }
            
            createTokenParser() {
                throw new Error('createTokenParser() must be implemented');
            }
            
            createUserInfoAdapter() {
                throw new Error('createUserInfoAdapter() must be implemented');
            }
        }

        // ========== 구체 제품: Google ==========
        
        class GoogleButton extends AbstractButton {
            constructor() {
                super();
                this.text = 'Google로 로그인';
                this.backgroundColor = '#4285F4';
                this.icon = `<svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>`;
            }
            
            render() {
                return { text: this.text, backgroundColor: this.backgroundColor, icon: this.icon };
            }
        }

        class GoogleAuthClient extends AbstractAuthClient {
            constructor() {
                super();
                this.baseUrl = 'https://accounts.google.com/o/oauth2/v2/auth';
                this.clientId = 'google-client-id';
            }
            
            authenticate() {
                return `Google OAuth 2.0 인증 시작`;
            }
            
            getAuthUrl() {
                return `${this.baseUrl}?client_id=${this.clientId}&redirect_uri=...`;
            }
        }

        class GoogleTokenParser extends AbstractTokenParser {
            parse(token) {
                return {
                    provider: 'Google',
                    tokenType: 'JWT',
                    algorithm: 'RS256',
                    claims: { iss: 'accounts.google.com', ...token }
                };
            }
            
            validate(token) {
                return token && token.startsWith('ya29.');
            }
        }

        class GoogleUserInfoAdapter extends AbstractUserInfoAdapter {
            adapt(rawData) {
                return {
                    id: rawData.sub,
                    email: rawData.email,
                    name: rawData.name,
                    picture: rawData.picture,
                    provider: 'google'
                };
            }
            
            getStandardFormat() {
                return { id: 'string', email: 'string', name: 'string', picture: 'string' };
            }
        }

        // ========== 구체 제품: Facebook ==========
        
        class FacebookButton extends AbstractButton {
            constructor() {
                super();
                this.text = 'Facebook으로 로그인';
                this.backgroundColor = '#1877F2';
                this.icon = `<svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>`;
            }
            
            render() {
                return { text: this.text, backgroundColor: this.backgroundColor, icon: this.icon };
            }
        }

        class FacebookAuthClient extends AbstractAuthClient {
            constructor() {
                super();
                this.baseUrl = 'https://www.facebook.com/v18.0/dialog/oauth';
                this.clientId = 'facebook-app-id';
            }
            
            authenticate() {
                return `Facebook OAuth 인증 시작`;
            }
            
            getAuthUrl() {
                return `${this.baseUrl}?client_id=${this.clientId}&redirect_uri=...`;
            }
        }

        class FacebookTokenParser extends AbstractTokenParser {
            parse(token) {
                return {
                    provider: 'Facebook',
                    tokenType: 'Bearer',
                    algorithm: 'HMAC-SHA256',
                    claims: { app_id: this.clientId, ...token }
                };
            }
            
            validate(token) {
                return token && token.length > 100;
            }
        }

        class FacebookUserInfoAdapter extends AbstractUserInfoAdapter {
            adapt(rawData) {
                return {
                    id: rawData.id,
                    email: rawData.email,
                    name: rawData.name,
                    picture: rawData.picture?.data?.url,
                    provider: 'facebook'
                };
            }
            
            getStandardFormat() {
                return { id: 'string', email: 'string', name: 'string', picture: 'string' };
            }
        }

        // ========== 구체 제품: GitHub ==========
        
        class GitHubButton extends AbstractButton {
            constructor() {
                super();
                this.text = 'GitHub로 로그인';
                this.backgroundColor = '#24292e';
                this.icon = `<svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>`;
            }
            
            render() {
                return { text: this.text, backgroundColor: this.backgroundColor, icon: this.icon };
            }
        }

        class GitHubAuthClient extends AbstractAuthClient {
            constructor() {
                super();
                this.baseUrl = 'https://github.com/login/oauth/authorize';
                this.clientId = 'github-client-id';
            }
            
            authenticate() {
                return `GitHub OAuth 인증 시작`;
            }
            
            getAuthUrl() {
                return `${this.baseUrl}?client_id=${this.clientId}&scope=user:email`;
            }
        }

        class GitHubTokenParser extends AbstractTokenParser {
            parse(token) {
                return {
                    provider: 'GitHub',
                    tokenType: 'token',
                    algorithm: 'SHA256',
                    scopes: ['user:email', 'read:user']
                };
            }
            
            validate(token) {
                return token && token.startsWith('gho_') || token.startsWith('ghu_');
            }
        }

        class GitHubUserInfoAdapter extends AbstractUserInfoAdapter {
            adapt(rawData) {
                return {
                    id: rawData.id.toString(),
                    email: rawData.email || rawData.login + '@users.noreply.github.com',
                    name: rawData.name || rawData.login,
                    picture: rawData.avatar_url,
                    provider: 'github'
                };
            }
            
            getStandardFormat() {
                return { id: 'string', email: 'string', name: 'string', picture: 'string' };
            }
        }

        // ========== 구체 제품: Kakao ==========
        
        class KakaoButton extends AbstractButton {
            constructor() {
                super();
                this.text = '카카오로 로그인';
                this.backgroundColor = '#FEE500';
                this.textColor = '#000000';
                this.icon = `<svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3C6.477 3 2 6.477 2 10.815c0 2.763 1.794 5.192 4.479 6.459l-1.14 4.168 4.378-2.902c.592.08 1.196.122 1.283.122 5.523 0 10-3.477 10-7.815S17.523 3 12 3z" fill="#000"/>
                </svg>`;
            }
            
            render() {
                return { text: this.text, backgroundColor: this.backgroundColor, icon: this.icon, textColor: this.textColor };
            }
        }

        class KakaoAuthClient extends AbstractAuthClient {
            constructor() {
                super();
                this.baseUrl = 'https://kauth.kakao.com/oauth/authorize';
                this.clientId = 'kakao-rest-api-key';
            }
            
            authenticate() {
                return `카카오 OAuth 인증 시작`;
            }
            
            getAuthUrl() {
                return `${this.baseUrl}?client_id=${this.clientId}&redirect_uri=...&response_type=code`;
            }
        }

        class KakaoTokenParser extends AbstractTokenParser {
            parse(token) {
                return {
                    provider: 'Kakao',
                    tokenType: 'Bearer',
                    algorithm: 'HS256',
                    tokenInfo: { access_token: token, token_type: 'bearer' }
                };
            }
            
            validate(token) {
                return token && typeof token === 'string' && token.length > 20;
            }
        }

        class KakaoUserInfoAdapter extends AbstractUserInfoAdapter {
            adapt(rawData) {
                return {
                    id: rawData.id.toString(),
                    email: rawData.kakao_account?.email,
                    name: rawData.kakao_account?.profile?.nickname,
                    picture: rawData.kakao_account?.profile?.profile_image_url,
                    provider: 'kakao'
                };
            }
            
            getStandardFormat() {
                return { id: 'string', email: 'string', name: 'string', picture: 'string' };
            }
        }

        // ========== 구체 제품: Naver ==========
        
        class NaverButton extends AbstractButton {
            constructor() {
                super();
                this.text = '네이버로 로그인';
                this.backgroundColor = '#03C75A';
                this.icon = `<svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16.273 12.845L7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845z"/>
                </svg>`;
            }
            
            render() {
                return { text: this.text, backgroundColor: this.backgroundColor, icon: this.icon };
            }
        }

        class NaverAuthClient extends AbstractAuthClient {
            constructor() {
                super();
                this.baseUrl = 'https://nid.naver.com/oauth2.0/authorize';
                this.clientId = 'naver-client-id';
            }
            
            authenticate() {
                return `네이버 OAuth 인증 시작`;
            }
            
            getAuthUrl() {
                return `${this.baseUrl}?client_id=${this.clientId}&response_type=code&redirect_uri=...`;
            }
        }

        class NaverTokenParser extends AbstractTokenParser {
            parse(token) {
                return {
                    provider: 'Naver',
                    tokenType: 'Bearer',
                    algorithm: 'HMAC-SHA256',
                    expiresIn: 3600
                };
            }
            
            validate(token) {
                return token && token.includes('access_token');
            }
        }

        class NaverUserInfoAdapter extends AbstractUserInfoAdapter {
            adapt(rawData) {
                return {
                    id: rawData.response.id,
                    email: rawData.response.email,
                    name: rawData.response.name,
                    picture: rawData.response.profile_image,
                    provider: 'naver'
                };
            }
            
            getStandardFormat() {
                return { id: 'string', email: 'string', name: 'string', picture: 'string' };
            }
        }

        // ========== 구체 팩토리들 ==========
        
        class GoogleFactory extends AbstractSocialFactory {
            createButton() {
                return new GoogleButton();
            }
            
            createAuthClient() {
                return new GoogleAuthClient();
            }
            
            createTokenParser() {
                return new GoogleTokenParser();
            }
            
            createUserInfoAdapter() {
                return new GoogleUserInfoAdapter();
            }
        }

        class FacebookFactory extends AbstractSocialFactory {
            createButton() {
                return new FacebookButton();
            }
            
            createAuthClient() {
                return new FacebookAuthClient();
            }
            
            createTokenParser() {
                return new FacebookTokenParser();
            }
            
            createUserInfoAdapter() {
                return new FacebookUserInfoAdapter();
            }
        }

        class GitHubFactory extends AbstractSocialFactory {
            createButton() {
                return new GitHubButton();
            }
            
            createAuthClient() {
                return new GitHubAuthClient();
            }
            
            createTokenParser() {
                return new GitHubTokenParser();
            }
            
            createUserInfoAdapter() {
                return new GitHubUserInfoAdapter();
            }
        }

        class KakaoFactory extends AbstractSocialFactory {
            createButton() {
                return new KakaoButton();
            }
            
            createAuthClient() {
                return new KakaoAuthClient();
            }
            
            createTokenParser() {
                return new KakaoTokenParser();
            }
            
            createUserInfoAdapter() {
                return new KakaoUserInfoAdapter();
            }
        }

        class NaverFactory extends AbstractSocialFactory {
            createButton() {
                return new NaverButton();
            }
            
            createAuthClient() {
                return new NaverAuthClient();
            }
            
            createTokenParser() {
                return new NaverTokenParser();
            }
            
            createUserInfoAdapter() {
                return new NaverUserInfoAdapter();
            }
        }

        // ========== 클라이언트 코드 ==========
        
        class SocialLoginPage {
            constructor() {
                this.factories = [
                    new GoogleFactory(),
                    new FacebookFactory(),
                    new GitHubFactory(),
                    new KakaoFactory(),
                    new NaverFactory()
                ];
                this.debugPanel = document.getElementById('debugPanel');
                this.debugContent = document.getElementById('debugContent');
            }

            render() {
                const container = document.getElementById('socialButtons');
                
                this.factories.forEach(factory => {
                    // 추상 팩토리 패턴: 관련 제품군을 함께 생성
                    const button = factory.createButton();
                    const authClient = factory.createAuthClient();
                    const tokenParser = factory.createTokenParser();
                    const userInfoAdapter = factory.createUserInfoAdapter();
                    
                    // 버튼 렌더링
                    const buttonData = button.render();
                    const buttonElement = this.createButtonElement(buttonData, () => {
                        this.handleLogin(factory, authClient, tokenParser, userInfoAdapter);
                    });
                    container.appendChild(buttonElement);
                    
                    // 디버그 정보 표시
                    this.logProductFamily(factory, button, authClient, tokenParser, userInfoAdapter);
                });
                
                this.debugPanel.style.display = 'block';
            }

            createButtonElement(buttonData, onClick) {
                const button = document.createElement('button');
                button.className = 'social-button';
                button.style.backgroundColor = buttonData.backgroundColor;
                button.style.color = buttonData.textColor || 'white';
                button.innerHTML = buttonData.icon + buttonData.text;
                button.onclick = onClick;
                return button;
            }

            handleLogin(factory, authClient, tokenParser, userInfoAdapter) {
                const provider = factory.constructor.name.replace('Factory', '');
                
                // 추상 팩토리로 생성된 제품군 사용
                const authMessage = authClient.authenticate();
                const authUrl = authClient.getAuthUrl();
                
                // 시뮬레이션: 토큰 파싱 및 사용자 정보 어댑팅
                const mockToken = 'mock-token-' + Date.now();
                const parsedToken = tokenParser.parse(mockToken);
                const isValid = tokenParser.validate(mockToken);
                
                const mockRawData = { id: '123', email: 'user@example.com', name: 'Test User' };
                const adaptedUserInfo = userInfoAdapter.adapt(mockRawData);
                
                alert(`${provider} 로그인 처리\n\n` +
                      `인증 URL: ${authUrl}\n` +
                      `토큰 유효성: ${isValid ? '유효' : '무효'}\n` +
                      `사용자 정보: ${adaptedUserInfo.name} (${adaptedUserInfo.email})`);
                
                console.log('제품군 사용:', {
                    authClient: authMessage,
                    tokenParser: parsedToken,
                    userInfoAdapter: adaptedUserInfo
                });
            }

            logProductFamily(factory, button, authClient, tokenParser, userInfoAdapter) {
                const provider = factory.constructor.name.replace('Factory', '');
                const div = document.createElement('div');
                div.className = 'debug-item';
                div.innerHTML = `
                    <strong>${provider} 제품군:</strong><br>
                    • Button: ${button.constructor.name}<br>
                    • AuthClient: ${authClient.constructor.name} (${authClient.getAuthUrl()})<br>
                    • TokenParser: ${tokenParser.constructor.name}<br>
                    • UserInfoAdapter: ${userInfoAdapter.constructor.name}
                `;
                this.debugContent.appendChild(div);
            }
        }

        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', () => {
            const loginPage = new SocialLoginPage();
            loginPage.render();
        });
    </script>
</body>
</html>
